name: CI/CD Pipeline - Sistema Restaurante

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-y-seguridad:
    name: 1. Análisis Estático y Seguridad (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql
      - name: Verificar sintaxis PHP (Lint)
        run: find src public tests -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Verificar secretos expuestos y funciones inseguras
        run: |
          ! grep -rn "eval(" src/ public/
          ! test -f .env

  build-y-pruebas:
    name: 2. Build y Pruebas Automatizadas (PHPUnit + PostgreSQL 16)
    needs: lint-y-seguridad
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: restaurante_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql
      - name: Instalar dependencias Composer
        run: composer install --no-interaction --prefer-dist
      - name: Auditoría de vulnerabilidades (composer audit)
        run: composer audit
      - name: Cargar esquema y datos de prueba en PostgreSQL 16
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h 127.0.0.1 -U postgres -d restaurante_test -f database/schema.sql
          psql -h 127.0.0.1 -U postgres -d restaurante_test -f database/seed.sql
      - name: Ejecutar pruebas unitarias y de integración
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_TEST_NAME: restaurante_test
          DB_USER: postgres
          DB_PASS: ci_password
        run: vendor/bin/phpunit --testdox

  despliegue-staging:
    name: 3. Despliegue Controlado a Apache (Staging)
    needs: build-y-pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar artefactos en Apache htdocs
        run: powershell -ExecutionPolicy Bypass -File scripts/run_pipeline.ps1 -OnlyDeploy
